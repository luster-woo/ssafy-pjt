{% extends "base.html" %}

{% block content %}
  <h1 class="fw-bold mt-3">영화 상세 페이지</h1>
  <hr>

  <div class="ms-1">
    <h2 class="fw-bold mb-3">{{ movie.title }}</h2>
    
    <p class="mb-3" style="line-height: 1.6;">
      {{ movie.content }}
    </p>
    
    <p class="fw-bold mb-4">{{ movie.director }}</p>

    <hr>

    <div class="d-flex mb-3">
      <a href="{% url 'movies:update' movie.pk %}" class="btn btn-secondary me-2 btn-sm px-3 text-uppercase">Update</a>
      
      <form action="{% url 'movies:delete' movie.pk %}" method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-sm px-3 text-uppercase">Delete</button>
      </form>
    </div>

    <hr>

    <div class="mt-3">
      <a href="{% url 'movies:index' %}" class="btn btn-primary btn-sm px-3 text-uppercase">Back</a>
    </div>
  </div>

{% endblock content %}
