<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

}

padding:40px;

</div>

<hr class="mt-5">
<h4 class="mb-4">회원정보</h4>
<form>
<div class="mb-3">
<label class="form-label">회원번호</label>
<input type="text" class="form-control" value="1" readonly>
</div>
<div class="mb-3">

<input type="text" class="form-control" placeholder="닉네임을 입력하세요">

</div>
</div>
<div class="col-md-6">
<label class="form-label">연봉</label>

</div>

</div>

<div id="portfolioPage" style="display:none;">
    <div class="card-box">
        <h3 class="text-center mb-4">포트폴리오 수정</h3>
        <form>
            <div class="mb-3">
                <label class="form-label">회원번호</label>
                <input type="text" class="form-control bg-light" value="1" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">ID</label>
                <input type="text" class="form-control bg-light" value="ssafy" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">저축 성향</label>
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="save" id="save1">
                            <label class="form-check-label" for="save1">도전형</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="save" id="save2">
                            <label class="form-check-label" for="save2">검소형</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="save" id="save3">
                            <label class="form-check-label" for="save3">알뜰형</label>
                        </div>
                    </div>
                    <button type="button" class="btn btn-info text-white">Update</button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">최애 은행</label>
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="가장 좋아하는 은행을 입력해주세요">
                    <button class="btn btn-info text-white" type="button">Update</button>
                </div>
            </div>
        </form>
    </div>
</div>

</div>

<script>
function showPage(page){
document.getElementById("infoPage").style.display="none";
document.getElementById("portfolioPage").style.display="none";

document.querySelectorAll(".nav-link").forEach(el=>{
el.classList.remove("active")
})

if(page==="info"){
document.getElementById("infoPage").style.display="block";
document.querySelectorAll(".nav-link")[0].classList.add("active")
}

if(page==="portfolio"){
document.getElementById("portfolioPage").style.display="block";
document.querySelectorAll(".nav-link")[1].classList.add("active")
}
}
</script>

</body>
</html>
